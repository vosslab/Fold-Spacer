<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fold Spacer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #050812; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #touchbar { position: absolute; right: 12px; bottom: 60px; display: none; gap: 8px; flex-direction: column; z-index: 5; }
  #touchbar button { font: 13px ui-monospace, Menlo, monospace; color: rgb(219,230,255); background: rgba(5,8,18,0.7); border: 1px solid rgba(219,230,255,0.35); padding: 10px 14px; border-radius: 4px; touch-action: manipulation; }
  #touchbar button:active { background: rgba(255,179,71,0.35); }
  @media (pointer: coarse) { #touchbar { display: flex; } }
  canvas, #stage { touch-action: none; }

</style>
</head>
<body>
<div id="stage" style="position:fixed;inset:0">
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touchbar">
  <button data-act="autopilot">autopilot</button><button data-act="colours">colours</button><button data-act="restart">restart</button><button data-act="next">next fold</button>
</div>
</div>
<script src="parse.js"></script>
<script src="ss.js"></script>
<script src="rail.js"></script>
<script src="cartoon.js"></script>
<script src="gl.js"></script>
<script src="folds.js"></script>
<script src="music.js"></script>
<script src="game.js"></script>
<script>
  document.querySelectorAll('#touchbar button').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); window.flyerAction(b.dataset.act); b.blur(); });
  });
</script>
</body>
</html>
